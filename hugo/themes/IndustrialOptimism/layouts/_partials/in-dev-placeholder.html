{{- $title := .title | default "In development" -}}
{{- $id := .id | default "in-dev-placeholder-title" -}}
{{- $message := .message | default "This section is currently being developed as part of the Flying Fortress Games website roadmap." -}}

<section class="in-dev-placeholder" aria-labelledby="{{ $id }}">
  <div class="site-frame in-dev-placeholder__inner">

    <h1 id="{{ $id }}" class="in-dev-placeholder__title">
      {{ $title }}
    </h1>

    <p class="in-dev-placeholder__status">
      In development
    </p>

    <p class="in-dev-placeholder__message">
      {{ $message }}
    </p>
  </div>
</section>
